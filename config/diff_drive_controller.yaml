controller_manager:
  ros__parameters:
    update_rate: 30

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diffbase_controller:
      type: diff_drive_controller/DiffDriveController

diffbase_controller:
  ros__parameters:
    left_wheel_names: ["roda_esquerda_joint"]
    right_wheel_names: ["roda_direita_joint"]

    wheel_separation: 0.35
    wheel_radius: 0.1

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonals: [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]
    twist_covariance_diagonals: [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]

    use_stamped_vel: false
