trajectory_eight_node:
  ros__parameters:
    # Trajetoria: x = A sin(wt), y = (B/2) sin(2wt)   (periodo = 2*pi/omega ~ 21 s)
    A: 1.0
    B: 2.0
    omega: 0.3

    # Controle (feedforward + realimentacao proporcional em um ponto a frente)
    kff: 1.0
    use_feedback: true
    kp_x: 2.0
    kp_y: 2.0
    lookahead: 0.25
    v_max: 0.8
    w_max: 2.5
    control_rate: 20.0

    # Fonte de pose para o controle:
    #   ekf     = /odometry/filtered  (filtro de Kalman, pratica 05)
    #   sensors = IMU + GPS com EMA   (pratica 04)
    #   odom    = /odom
    pose_source: ekf
    use_sensors: true
    start_delay: 3.0
    gps_origin_samples: 10

    # Gazebo 11 publica lat/lon com Leste e Norte invertidos (bug conhecido).
    gps_x_sign: -1.0
    gps_y_sign: -1.0

    gps_offset_x: -0.15
    gps_offset_y: 0.0

    # Usado apenas se pose_source:=sensors
    gps_filter_alpha: 0.6
